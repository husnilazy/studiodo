services:
  postgres:
    image: postgres:16-alpine
    container_name: studiodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studiodo
      POSTGRES_PASSWORD: studiodo
      POSTGRES_DB: studiodo
    ports:
      - "5433:5432"
    volumes:
      - studiodo_pgdata:/var/lib/postgresql/data

volumes:
  studiodo_pgdata:
  