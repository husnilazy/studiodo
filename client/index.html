    <style>
      html, body { margin: 0; background: #0b0b10; }
      /* Boot splash: painted from this HTML alone, before any JS runs, so the window is never blank while the bundle
         loads. React's first render replaces the contents of #root, which removes it. */
      #boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: radial-gradient(circle at 50% 40%, #1a1a24 0%, #0b0b10 70%); color: #e8e8ee; font-family: system-ui, "Segoe UI", sans-serif; }
      #boot-splash img { width: 132px; height: 132px; border-radius: 28px; animation: boot-pulse 1.8s ease-in-out infinite; }
      #boot-splash .boot-bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
      #boot-splash .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #fff; animation: boot-slide 1.2s ease-in-out infinite; }
      #boot-splash p { margin: 0; font-size: 14px; letter-spacing: .08em; color: rgba(232,232,238,.6); }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.05); opacity: 1; } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
